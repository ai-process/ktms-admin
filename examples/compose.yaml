# The whole family: KTMS (formerly llm-proxy), light-tokenmeter and this console on one Postgres.
# Copy env.example to .env, fill in a sign-in method (ADMIN_USERS is the quickest) and the keys, then:
#   docker compose -f examples/compose.yaml --env-file .env up -d
#
# First run: mint the console's key, then restart the console:
#   grpcurl -plaintext -H "authorization: Bearer $BOOTSTRAP_ADMIN_KEY" -d '{"name":"console","scopes":["admin"]}' \
#     localhost:9090 ktms.v1.AdminService/MintAPIKey
# Put the returned key in .env as KTMS_ADMIN_KEY.
# Upgrading from the llm-proxy service name: run `up` once with --remove-orphans,
# or the old container keeps port 9090.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  ktms:
    image: coyl/ktms:latest
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://postgres:${DB_PASSWORD:-postgres}@db:5432/llmproxy?sslmode=disable
      KTMS_ENCRYPTION_KEYS: "${KTMS_ENCRYPTION_KEYS:?set KTMS_ENCRYPTION_KEYS in .env, see env.example}"
      BOOTSTRAP_ADMIN_KEY: ${BOOTSTRAP_ADMIN_KEY:-}
      USAGE_COLLECTOR_HOST: light-tokenmeter:9090
    ports: ["9090:9090"]

  light-tokenmeter:
    image: coyl/light-tokenmeter:latest
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://postgres:${DB_PASSWORD:-postgres}@db:5432/tokenmeter?sslmode=disable

  console:
    image: coyl/ktms-admin:latest
    restart: unless-stopped
    depends_on: [ktms, light-tokenmeter]
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
      # At least one sign-in method; see the README.
      ADMIN_USERS: ${ADMIN_USERS:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      # Deprecated names, passed on so the console can warn about them.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_NAME: ${OIDC_NAME:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      AUTH_HEADER_EMAIL: ${AUTH_HEADER_EMAIL:-}
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:?set ALLOWED_EMAILS in .env}
      VIEWER_EMAILS: ${VIEWER_EMAILS:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      KTMS_ADDR: ktms:9090
      KTMS_ADMIN_KEY: ${KTMS_ADMIN_KEY:-}
      TOKENMETER_URL: http://light-tokenmeter:8080
    ports: ["8080:8080"]

volumes:
  pgdata:
