name: Publish Docker image

# Every v* tag becomes an image on Docker Hub: coyl/ktms-admin:<version>, also
# under the old name coyl/llm-proxy-admin so existing deployments keep pulling.
# Needs the repository secrets DOCKER_USERNAME and DOCKER_PASSWORD (an access token).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # keyless cosign signing with the workflow's GitHub OIDC identity

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A backport must not move latest back to an older line.
      - name: Is this the newest release
        id: newest
        run: |
          top=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          echo "yes=$([ "$top" = "$GITHUB_REF_NAME" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            coyl/ktms-admin
            coyl/llm-proxy-admin
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: latest=${{ steps.newest.outputs.yes }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      # Pinned by commit: this job can mint signatures under the release identity.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # Both names point at one digest, so one recursive signature covers them;
      # retried so a Rekor or Fulcio blip does not leave the tag unsigned.
      - name: Sign the image
        run: |
          for i in 1 2 3; do
            cosign sign --yes --recursive "coyl/ktms-admin@${{ steps.build.outputs.digest }}" &&
              cosign sign --yes --recursive "coyl/llm-proxy-admin@${{ steps.build.outputs.digest }}" && exit 0
            sleep $((i * 15))
          done
          exit 1
