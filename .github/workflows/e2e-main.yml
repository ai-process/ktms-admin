name: E2E against main

# KTMS and light-tokenmeter main move on their own; this daily run notices
# before the pinned pair in scripts/e2e.refs is moved forward.
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Builds and tests with ktms.v1 from KTMS main
        run: go get github.com/ai-process/ktms@main && go mod tidy && go build ./... && go test ./...
      - name: End-to-end with KTMS and light-tokenmeter main
        if: success() || failure()
        env:
          KTMS_REF: main
          TOKENMETER_REF: main
        run: ./scripts/e2e.sh
