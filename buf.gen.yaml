version: v2
plugins:
  # Pinned: a new plugin release must not turn the generated-code check red.
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: internal/gen
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go:v1.6.2
    out: internal/gen
    opt:
      - paths=source_relative
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/ai-process/ktms-admin/internal/gen
